<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
  :root {
    --ink: #FAF9F5;
    --surface: #FFFFFF;
    --surface-2: #F1F2F4;
    --surface-3: #E6E8EB;
    --gold: #2563EB;
    --gold-bright: #2563EB;
    --gold-deep: #1D4ED8;
    --gold-soft: rgba(37, 99, 235, .10);
    --text: #16181D;
    --text-muted: #6B7280;
    --border: rgba(17, 24, 39, .12);
    --border-soft: rgba(17, 24, 39, .07);
    --paid: #4E8A5B;
    --paid-soft: rgba(78, 138, 91, .12);
    --pending: #D97706;
    --pending-soft: rgba(217, 119, 6, .12);
    --danger: #DC2626;
    --danger-soft: rgba(220, 38, 38, .10);
    --shadow: 0 10px 30px rgba(15, 23, 42, .12);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--text);
    margin: 0;
  }
  #app {
    direction: rtl;
    font-family: 'Heebo', 'Segoe UI', sans-serif;
    min-height: 100%;
    display: flex;
    background: var(--ink);
  }
  h1, h2, h3, .display { font-family: 'Frank Ruhl Libre', serif; }
  button, input, select, textarea { font-family: inherit; }
  ::selection { background: var(--gold-soft); }

  /* ---------- Nav ---------- */
  .nav {
    width: 220px;
    flex: 0 0 220px;
    background: var(--surface);
    border-left: 1px solid var(--border-soft);
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 6px;
  }
  .brand .word {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--gold-bright);
    letter-spacing: .02em;
  }
  .brand .sub {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: .06em;
  }
  .nav-links { display: flex; flex-direction: column; gap: 4px; }
  .nav-link {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 10px;
    color: var(--text-muted); background: transparent; border: none;
    font-size: 14.5px; cursor: pointer; text-align: right; width: 100%;
  }
  .nav-link .ic { font-size: 16px; width: 20px; text-align: center; }
  .nav-link:hover { background: var(--surface-2); color: var(--text); }
  .nav-link.active { background: var(--gold-soft); color: var(--gold); font-weight: 600; }
  .nav-spacer { flex: 1; }
  .nav-cta {
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #ffffff; border: none; border-radius: 10px;
    padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .nav-cta:active { transform: scale(.98); }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: 28px 34px 60px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .page-head h1 { font-size: 26px; margin: 0; color: var(--text); font-weight: 700; }
  .page-head .hint { color: var(--text-muted); font-size: 13.5px; margin-top: 4px; }

  .btn {
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--surface-3); }
  .btn.primary {
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #ffffff; border: none;
  }
  .btn.ghost { background: transparent; border: 1px solid var(--border); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(220,38,38,.35); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { padding: 7px 12px; font-size: 12.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 18px 20px;
  }

  /* ---------- Dashboard ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .kpi { padding: 18px 20px; }
  .kpi .label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
  .kpi .value { font-family: 'Frank Ruhl Libre', serif; font-size: 28px; font-weight: 700; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
  .kpi .value.small { font-size: 22px; }
  .kpi.pending .value { color: var(--pending); }

  .section-title { font-size: 15px; font-weight: 700; margin: 26px 0 12px; color: var(--text); }

  /* ---------- Table / list ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 12px; padding: 13px 16px; cursor: pointer;
  }
  .row-card:hover { border-color: var(--border); }
  .row-num {
    font-family: 'Frank Ruhl Libre', serif; font-weight: 700; color: var(--gold);
    font-size: 14px; width: 46px; flex: 0 0 auto; font-variant-numeric: tabular-nums;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-main .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-main .desc { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-amount { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; flex: 0 0 auto; }
  .row-date { color: var(--text-muted); font-size: 12px; flex: 0 0 auto; width: 78px; text-align: center; }
  .chip { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; flex: 0 0 auto; }
  .chip.paid { background: var(--paid-soft); color: var(--paid); }
  .chip.pending { background: var(--pending-soft); color: var(--pending); }
  .chip.draft { background: var(--surface-3); color: var(--text-muted); }
  .chip.sent { background: var(--gold-soft); color: var(--gold); }
  .chip.declined { background: var(--danger-soft); color: var(--danger); }
  .empty {
    text-align: center; padding: 50px 20px; color: var(--text-muted);
    border: 1px dashed var(--border); border-radius: var(--radius); font-size: 14px;
  }
  .empty .big { font-size: 34px; margin-bottom: 10px; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 180px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px;
  }
  .search::placeholder { color: var(--text-muted); }

  /* ---------- Forms ---------- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
  .field input, .field select, .field textarea {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 13px; color: var(--text); font-size: 15px;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 1.5px solid var(--gold); border-color: var(--gold); }
  .field textarea { resize: vertical; min-height: 64px; font-family: inherit; }
  .amount-wrap { position: relative; }
  .amount-wrap .sign { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .amount-wrap input { padding-right: 30px; font-variant-numeric: tabular-nums; }

  .chip-toggle { display: flex; gap: 8px; }
  .chip-toggle button {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-muted); cursor: pointer; font-size: 13.5px; font-weight: 600;
  }
  .chip-toggle button.active.paid { background: var(--paid-soft); color: var(--paid); border-color: rgba(124,154,99,.4); }
  .chip-toggle button.active.pending { background: var(--pending-soft); color: var(--pending); border-color: rgba(207,154,74,.4); }

  .autocomplete { position: relative; }
  .ac-list {
    position: absolute; top: calc(100% + 4px); right: 0; left: 0; z-index: 5;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    max-height: 220px; overflow-y: auto; box-shadow: var(--shadow);
  }
  .ac-item { padding: 10px 13px; cursor: pointer; font-size: 14px; }
  .ac-item:hover { background: var(--surface-3); }
  .ac-item .n { font-weight: 600; }
  .ac-item .p { color: var(--text-muted); font-size: 12px; }
  .ac-new { color: var(--gold); font-weight: 600; }

  /* ---------- Modal / receipt ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 40; overflow-y: auto;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; max-width: 560px; width: 100%; box-shadow: var(--shadow);
    padding: 26px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .modal-head h2 { margin: 0; font-size: 20px; }
  .close-x { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; }

  .receipt-doc {
    background: #ffffff; color: #16181d; border-radius: 12px; padding: 26px 24px;
    font-family: 'Heebo', sans-serif; border: 1px solid #e5e7eb;
  }
  .receipt-doc .rd-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #2563eb; padding-bottom: 14px; margin-bottom: 16px; }
  .receipt-doc .rd-brand { font-family: 'Frank Ruhl Libre', serif; font-size: 20px; font-weight: 700; color: #1d4ed8; }
  .receipt-doc .rd-biz { font-size: 12px; color: #6b7280; margin-top: 4px; line-height: 1.6; }
  .receipt-doc .rd-title { text-align: left; }
  .receipt-doc .rd-title .t { font-family: 'Frank Ruhl Libre', serif; font-size: 17px; font-weight: 700; }
  .receipt-doc .rd-title .n { font-size: 13px; color: #6b7280; margin-top: 2px; }
  .receipt-doc .rd-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 7px 0; border-bottom: 1px solid #e5e7eb; }
  .receipt-doc .rd-row .k { color: #6b7280; }
  .receipt-doc .rd-row .v { font-weight: 600; }
  .receipt-doc .rd-desc { font-size: 13.5px; margin: 14px 0; line-height: 1.6; background: #f3f4f6; border-radius: 8px; padding: 12px 14px; }
  .receipt-doc .rd-amount { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; padding-top: 14px; border-top: 2px solid #2563eb; }
  .receipt-doc .rd-amount .k { font-size: 14px; font-weight: 700; }
  .receipt-doc .rd-amount .v { font-family: 'Frank Ruhl Libre', serif; font-size: 26px; font-weight: 700; color: #1d4ed8; font-variant-numeric: tabular-nums; }
  .receipt-doc .rd-foot { margin-top: 16px; font-size: 10.5px; color: #9ca3af; text-align: center; }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .modal-actions select.btn { appearance: none; -webkit-appearance: none; padding-left: 16px; }
  .send-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-top: 20px; letter-spacing: .02em; }

  /* ---------- Quote items ---------- */
  .items { display: flex; flex-direction: column; gap: 8px; }
  .item-row { display: grid; grid-template-columns: 1fr 76px 130px 90px 36px; gap: 8px; align-items: center; }
  .item-row input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 15px; width: 100%; min-width: 0; }
  .item-row input:focus { outline: 1.5px solid var(--gold); border-color: var(--gold); }
  .item-row .amount-wrap input { padding-right: 28px; }
  .item-head { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .m-lbl { display: none; }
  .i-line { font-weight: 700; font-variant-numeric: tabular-nums; text-align: left; }
  .i-del { background: none; border: 1px solid var(--border); border-radius: 10px; height: 40px; color: var(--text-muted); cursor: pointer; }
  .i-del:disabled { opacity: .35; cursor: default; }
  .q-sum { margin-top: 16px; border-top: 1px solid var(--border-soft); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; max-width: 360px; margin-inline-start: auto; }
  .q-sum-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; color: var(--text-muted); }
  .q-sum-row .amount-wrap input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 28px 8px 10px; font-size: 15px; width: 100%; color: var(--text); }
  .q-sum-row.total { font-size: 17px; font-weight: 800; color: var(--text); }
  .q-sum-row.total span:last-child { color: var(--gold); font-variant-numeric: tabular-nums; }

  .receipt-doc .rd-items { width: 100%; border-collapse: collapse; margin: 16px 0 6px; font-size: 13px; }
  .receipt-doc .rd-items th { text-align: right; color: #6b7280; font-weight: 600; font-size: 12px; padding: 8px 6px; border-bottom: 1.5px solid #d1d5db; }
  .receipt-doc .rd-items td { padding: 9px 6px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  .receipt-doc .rd-items .num { text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; width: 1%; }
  .receipt-doc .rd-valid { margin-top: 12px; font-size: 12.5px; font-weight: 600; color: #1d4ed8; }
  .receipt-doc .rd-terms { margin-top: 12px; font-size: 11.5px; color: #4b5563; line-height: 1.6; white-space: pre-line; }
  .receipt-doc .rd-desc { white-space: pre-line; }

  /* ---------- Setup gate ---------- */
  .gate { max-width: 560px; margin: 40px auto; }
  .gate .lead { color: var(--text-muted); font-size: 14.5px; line-height: 1.7; margin-bottom: 22px; }

  @media (max-width: 820px) {
    #app { flex-direction: column; }
    .nav-links {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--surface); border-top: 1px solid var(--border-soft);
      justify-content: space-around; gap: 0 !important;
      padding: 4px 2px calc(4px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -6px 20px rgba(15, 23, 42, .06);
    }
    .nav-link { flex-direction: column; flex: 1; gap: 2px !important; padding: 7px 2px !important; font-size: 10.5px !important; text-align: center !important; min-width: 0; }
    .nav-link span.lbl { display: block !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .nav-link .ic { width: auto; font-size: 17px; }
    .nav { justify-content: space-between; }
    .main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important; }
    .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)) !important; max-width: calc(100vw - 32px); }
    .field input, .field select, .field textarea, .search, .item-row input, .q-sum-row .amount-wrap input { font-size: 16px; }
    .overlay { padding: 12px 10px calc(96px + env(safe-area-inset-bottom, 0px)); }
    .modal { padding: 18px 16px; }
    .modal .receipt-doc { padding: 20px 16px; }
    .modal .receipt-doc .rd-head { flex-direction: column; gap: 10px; }
    .modal .receipt-doc .rd-title { text-align: right; }
    .modal-actions .btn { flex: 1 1 auto; }
    .item-row { grid-template-columns: 1fr 1fr 40px; align-items: end; }
    .m-lbl { display: block; font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 4px; }
    .item-row .i-desc { grid-column: 1 / -1; }
    .item-row .i-line { display: none; }
    .item-head { display: none; }
    .items .item-row + .item-row { border-top: 1px dashed var(--border); padding-top: 10px; }
    .q-sum { max-width: none; }
    .row-card { flex-wrap: wrap; row-gap: 6px; }
    .row-main { flex-basis: calc(100% - 70px); }
    .nav { width: 100%; flex: none; height: auto; position: sticky; top: 0; flex-direction: row; align-items: center; padding: 12px 14px; z-index: 20; border-left: none; border-bottom: 1px solid var(--border-soft); }
    .brand { flex-direction: row; align-items: baseline; gap: 8px; }
    .nav-links { flex-direction: row; overflow-x: auto; }
    .nav-link span.lbl { display: none; }
    .nav-link { padding: 10px; }
    .nav-spacer { display: none; }
    .nav-cta { padding: 10px 14px; white-space: nowrap; }
    .main { padding: 18px 16px 40px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .row-date { display: none; }
  }

  @page { size: A4; margin: 12mm; }
  @media print {
    body * { visibility: hidden; }
    .pdf-holder { display: none !important; }
    .receipt-doc { border: none !important; }
    .receipt-doc, .receipt-doc * { visibility: visible; }
    .receipt-doc { position: absolute; top: 0; right: 0; left: 0; margin: 0; border-radius: 0; }
  }
  /* ---------- Login ---------- */
  .login { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; text-align: center; }
  .login .word { font-family: 'Frank Ruhl Libre', serif; font-size: 34px; font-weight: 700; color: var(--gold); }
  .login .lead { color: var(--text-muted); font-size: 14.5px; line-height: 1.7; margin: 10px 0 26px; }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #1f1f1f; border: 1px solid #dadce0; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .gbtn:hover { background: #f8f9fa; }
  .gbtn svg { width: 20px; height: 20px; }
  .login .err { color: var(--danger); font-size: 13px; margin-top: 16px; line-height: 1.6; }
</style>

      if (attrs[k] == null) return;
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }

  function fmtMoney(n) {
    n = Number(n) || 0;
    return '₪' + n.toLocaleString('he-IL', { maximumFractionDigits: 0 });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('he-IL');
  }
  function todayIso() {
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  function showToast(msg) {
    state.toast = msg;
    render();
    setTimeout(function () { state.toast = null; render(); }, 2400);

  // ---------------- boot ----------------
  var unsubs = [];
  function stopListeners() { unsubs.forEach(function (u) { try { u(); } catch (e) {} }); unsubs = []; }
  function onListenError(e) {
    if (e && e.code === 'permission-denied') { state.accessDenied = true; }
    state.settingsLoaded = true; render();
  }

  function boot() {
    render();
    auth.getRedirectResult().catch(function (e) { state.loginError = loginErrorText(e); render(); });
    auth.onAuthStateChanged(function (user) {
      stopListeners();
      state.user = user;
      state.authChecked = true;
      state.accessDenied = false;
      state.settings = null; state.settingsLoaded = false;
      state._settingsDraft = null;
      state.clients = []; state.receipts = []; state.expenses = []; state.quotes = [];
      state.db = user ? fdb : null;
      state.dbReady = true;
      render();
      if (!user) return;
      var db = fdb;
      unsubs.push(db.doc('settings/business').onSnapshot(function (snap) {
        state.settings = snap.exists ? snap.data() : null;
        state.settingsLoaded = true;
        render();
      }, onListenError));
      unsubs.push(db.collection('clients').orderBy('name').onSnapshot(function (qs) {
        state.clients = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        render();
      }, onListenError));
      unsubs.push(db.collection('receipts').orderBy('number', 'desc').limit(1000).onSnapshot(function (qs) {
        state.receipts = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        render();
      }, onListenError));
      unsubs.push(db.collection('quotes').orderBy('number', 'desc').limit(1000).onSnapshot(function (qs) {
        state.quotes = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        render();
      }, onListenError));
      unsubs.push(db.collection('expenses').orderBy('date', 'desc').limit(1000).onSnapshot(function (qs) {
        state.expenses = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        render();
      }, onListenError));
    });
  }

  function loginErrorText(e) {
    var c = (e && e.code) || '';
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
    if (c === 'auth/unauthorized-domain') return 'הכתובת של האתר עוד לא אושרה ב-Firebase. צריך להוסיף אותה ב-Authentication, בלשונית Settings, תחת Authorized domains.';
    if (c === 'auth/network-request-failed') return 'אין חיבור לאינטרנט. בדקו את החיבור ונסו שוב.';
    return 'הכניסה לא הצליחה, נסו שוב' + (c ? ' (' + c + ')' : '');
  }

  function signIn() {
    state.loginError = ''; render();
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(provider).catch(function (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
        return auth.signInWithRedirect(provider);
      }
      state.loginError = loginErrorText(e); render();
    });
  }
  function signOut() {

    auth.signOut();

  // שמירת קובץ למחשב או לטלפון
  function saveFile(filename, data, mime) {
    try {
      var blob = (data instanceof Blob && !mime) ? data : new Blob([data], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return Promise.resolve();
    } catch (e) { return Promise.reject(e); }
  }

  async function saveNewExpense() {
    var d = state.newExpenseDraft;
    if (state.saving) return;
    if (!(Number(d.amount) > 0)) { showToast('צריך למלא סכום גדול מ-0'); return; }
    if (!state.db) { showToast('צריך להתחבר כדי לשמור'); return; }
    state.saving = true; render();
    try {
      await state.db.collection('expenses').add({
        date: d.date, category: d.category, description: d.description || '',
        vendor: d.vendor || '', amount: Number(d.amount), method: d.method, notes: d.notes || '',
        createdAt: Date.now()
      });
      state.saving = false;
      state.view = 'expenses';
      render();
      showToast('ההוצאה נרשמה');
    } catch (e) {
      state.saving = false; render();
      showToast('שגיאה ברישום ההוצאה, נסו שוב');
    }
  }

    try { await state.db.doc('expenses/' + x.id).delete(); showToast('ההוצאה נמחקה'); }

    try {
      var clientId = await ensureClient(d);
      var receiptRef = state.db.collection('receipts').doc();
      var number = await state.db.runTransaction(function (tx) {
        var sref = state.db.doc('settings/business');
        return tx.get(sref).then(function (snap) {
          var sd = snap.exists ? snap.data() : {};
          var n = Number(sd.nextNumber) || Number(sd.startNumber) || 1;
          tx.set(sref, { nextNumber: n + 1 }, { merge: true });
          if (d.fromQuoteId) tx.update(state.db.doc('quotes/' + d.fromQuoteId), { status: 'approved', receiptId: receiptRef.id });
          tx.set(receiptRef, {
            number: n, clientId: clientId, clientName: d.clientName.trim(),
            clientPhone: d.clientPhone || '', clientEmail: (d.clientEmail || '').trim(), description: d.description || '',
            amount: Number(d.amount), method: d.method, status: d.status, fromQuoteId: d.fromQuoteId || null,
            eventDate: d.eventDate, issueDate: d.issueDate, notes: d.notes || '',
            createdAt: Date.now(), createdBy: (state.user && state.user.email) || ''

          return n;
        });
      });
      state.saving = false;

      showToast('הקבלה מס\' ' + number + ' נוצרה');

  // ---------------- PDF ----------------
  var LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ];
  var libsPromise = null;
  function loadPdfLibs() {
    if (libsPromise) return libsPromise;
    libsPromise = LIBS.reduce(function (p, src) {
      return p.then(function () {
        return new Promise(function (res, rej) {
          var sc = document.createElement('script');
          sc.src = src; sc.onload = res; sc.onerror = rej;
          document.head.appendChild(sc);
        });
      });
    }, Promise.resolve()).catch(function (e) { libsPromise = null; throw e; });
    return libsPromise;
  }

  var pdfCache = {};
  function pdfKey(r, s) {
    return [r.id, r.number, r.status, r.amount, r.method, r.clientName, r.description, r.issueDate, r.eventDate,
      s.businessName, s.idNumber, s.address, s.phone, s.email, s.exemptNote].join('|');
  }
  function pdfFileName(r) { return 'קבלה-' + r.number + '-Memories4U.pdf'; }
  function receiptPdfEntry(r, s) { return getPdf('r|' + pdfKey(r, s), function () { return buildReceiptDoc(r, s); }); }

  // מכין את ה-PDF מראש כשהמסמך נפתח, כדי שכפתורי השליחה יעבדו מיד גם באייפד ובטלפון
  function getPdf(key, buildFn) {
    var entry = pdfCache[key];
    if (entry) return entry;
    entry = pdfCache[key] = { blob: null, error: null };
    makePdf(buildFn).then(function (blob) {
      entry.blob = blob; render();
    }).catch(function () {
      entry.error = true; render();
      setTimeout(function () { if (pdfCache[key] === entry) delete pdfCache[key]; }, 3000);
    });
    return entry;
  }

  var pdfQueue = Promise.resolve();
  function makePdf(buildFn) {
    var job = pdfQueue.then(function () { return makePdfNow(buildFn); });
    pdfQueue = job.catch(function () {});
    return job;
  }
  async function makePdfNow(buildFn) {
    await loadPdfLibs();
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    var holder = el('div', { dir: 'rtl', class: 'pdf-holder', style: 'position:fixed;left:-10000px;top:0;width:760px;background:#fff;padding:36px;font-family:Heebo,sans-serif' }, [buildFn()]);
    document.body.appendChild(holder);
    try {
      var canvas = await window.html2canvas(holder, { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false });
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
      var pageW = 210, pageH = 297, margin = 10;
      var w = pageW - margin * 2;
      var h = canvas.height * w / canvas.width;
      var maxH = pageH - margin * 2;
      if (h <= maxH) {
        doc.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, w, h);
      } else {
        // מסמך ארוך, מחלקים לכמה עמודים
        var sliceH = Math.floor(canvas.width * maxH / w);
        for (var y = 0, page = 0; y < canvas.height; y += sliceH, page++) {
          var part = document.createElement('canvas');
          part.width = canvas.width; part.height = Math.min(sliceH, canvas.height - y);
          var ctx = part.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, part.width, part.height);
          ctx.drawImage(canvas, 0, y, canvas.width, part.height, 0, 0, canvas.width, part.height);
          if (page) doc.addPage();
          doc.addImage(part.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, w, part.height * w / canvas.width);
        }
      }
      return doc.output('blob');
    } finally {
      holder.remove();
    }
  }

  function waPhone(p) {
    var d = String(p || '').replace(/\D/g, '');
    if (d.indexOf('00') === 0) d = d.slice(2);
    if (d.charAt(0) === '0') d = '972' + d.slice(1);
    return d;
  }

  function clientPicker(d) {

  // מוצא לקוח קיים לפי שם או יוצר חדש, ומעדכן טלפון ומייל אם נוספו
  async function ensureClient(d) {
    var name = d.clientName.trim();
    var clientId = d.clientId;
    var existing = clientId
      ? state.clients.find(function (c) { return c.id === clientId; })
      : state.clients.find(function (c) { return c.name === name; });
    if (existing) {
      var upd = {};
      if (d.clientPhone && d.clientPhone !== existing.phone) upd.phone = d.clientPhone;
      if (d.clientEmail && d.clientEmail !== existing.email) upd.email = d.clientEmail;
      if (Object.keys(upd).length) { try { await state.db.doc('clients/' + existing.id).update(upd); } catch (e) {} }
      return existing.id;
    }
    var ref = await state.db.collection('clients').add({
      name: name, phone: d.clientPhone || '', email: d.clientEmail || '', createdAt: Date.now()
    });
    return ref.id;
  }

  // ---------------- sending (shared) ----------------
  function canShareFiles() {
    try {
      return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.pdf', { type: 'application/pdf' })] }));
    } catch (e) { return false; }
  }
  function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim()); }

  // o: { entry, fileName, title, phone, email, subject, message }
  function sendDoc(channel, o) {
    if (!o.entry || !o.entry.blob) { showToast('ה-PDF עדיין בהכנה, רגע אחד'); return false; }
    var file = null;
    try { file = new File([o.entry.blob], o.fileName, { type: 'application/pdf' }); } catch (e) {}
    if (file && canShareFiles()) {
      navigator.share({ files: [file], title: o.title }).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        fallback();
      });
      return true;
    }
    fallback();
    return true;

    function fallback() {
      saveFile(o.fileName, o.entry.blob);
      if (channel === 'wa') {
        var ph = waPhone(o.phone);
        var url = 'https://wa.me/' + (ph.length >= 11 ? ph : '') + '?text=' + encodeURIComponent(o.message);
        window.open(url, '_blank', 'noopener');
        showToast('ה-PDF ירד למחשב. גררו אותו לצ\'אט בוואטסאפ');
      } else if (channel === 'mail') {
        var to = isEmail(o.email) ? o.email.trim() : '';
        location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(o.subject) + '&body=' + encodeURIComponent(o.message);
        showToast('ה-PDF ירד למחשב. צרפו אותו למייל');
      } else {
        showToast('ה-PDF ירד למחשב');
      }
    }
  }

  function sendBar(o, onSent) {
    var ready = !!(o.entry && o.entry.blob);
    var label = function (t) { return ready ? t : (o.entry && o.entry.error ? 'שגיאה בהכנת PDF' : 'מכין PDF...'); };
    function go(ch) { if (sendDoc(ch, o) && onSent) onSent(ch); }
    return [
      el('button', { class: 'btn primary', disabled: ready ? null : 'disabled', onclick: function () { go('wa'); } }, [label('וואטסאפ')]),
      el('button', { class: 'btn primary', disabled: ready ? null : 'disabled', onclick: function () { go('mail'); } }, [label('מייל')]),
      el('button', { class: 'btn ghost', onclick: function () { window.print(); if (onSent) onSent('print'); } }, ['הדפסה 🖨']),
      ready && !canShareFiles() ? el('button', { class: 'btn ghost', onclick: function () { saveFile(o.fileName, o.entry.blob); } }, ['הורדת PDF']) : null,
    ];
  }

  // ---------------- quotes ----------------
  var QUOTE_STATUS = {
    draft: { label: 'טיוטה', cls: 'draft' },
    sent: { label: 'נשלחה', cls: 'sent' },
    approved: { label: 'אושרה', cls: 'paid' },
    declined: { label: 'לא אושרה', cls: 'declined' },
  };
  function addDaysIso(iso, days) {
    var d = new Date(iso + 'T12:00:00');
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);

  async function saveQuote() {
    var d = state.quoteDraft;
    if (state.saving) return;
    if (!d.clientName.trim()) { showToast('צריך למלא שם לקוח'); return; }
    var items = d.items.filter(function (it) { return (it.desc || '').trim() || Number(it.price) > 0; })
      .map(function (it) { return { desc: (it.desc || '').trim(), qty: Number(it.qty) || 0, price: Number(it.price) || 0 }; });
    if (!items.length) { showToast('צריך להוסיף לפחות פריט אחד'); return; }
    if (d.clientEmail && !isEmail(d.clientEmail)) { showToast('כתובת המייל לא תקינה'); return; }
    if (!state.db) { showToast('צריך להתחבר כדי לשמור'); return; }
    state.saving = true; render();
    try {
      var clientId = await ensureClient(d);
      var body = {
        clientId: clientId, clientName: d.clientName.trim(), clientPhone: d.clientPhone || '', clientEmail: (d.clientEmail || '').trim(),
        eventType: d.eventType || '', eventDate: d.eventDate || '', location: d.location || '',
        items: items, discount: Number(d.discount) || 0,
        issueDate: d.issueDate || todayIso(), validUntil: d.validUntil || '', notes: d.notes || '',
        updatedAt: Date.now()
      };
      var id = d.id, number;
      if (id) {
        await state.db.doc('quotes/' + id).update(body);
      } else {
        var ref = state.db.collection('quotes').doc();
        id = ref.id;
        number = await state.db.runTransaction(function (tx) {
          var sref = state.db.doc('settings/business');
          return tx.get(sref).then(function (snap) {
            var n = Number((snap.exists ? snap.data() : {}).quoteNextNumber) || 1;
            tx.set(sref, { quoteNextNumber: n + 1 }, { merge: true });
            tx.set(ref, Object.assign({ number: n, status: 'draft', createdAt: Date.now() }, body));
            return n;
          });
        });
      }
      state.saving = false;
      state.view = 'quotes';
      state.activeQuoteId = id;
      render();
      showToast(number ? 'הצעת מחיר מס\' ' + number + ' נוצרה' : 'ההצעה עודכנה');
    } catch (e) {
      state.saving = false; render();
      showToast('שגיאה בשמירת ההצעה, נסו שוב');
    }
  }

  async function deleteQuote(q) {
    if (!confirm('למחוק את הצעת המחיר מס\' ' + q.number + '?')) return;
    if (!state.db) return;
    try { await state.db.doc('quotes/' + q.id).delete(); state.activeQuoteId = null; showToast('ההצעה נמחקה'); render(); }
    catch (e) { showToast('שגיאה במחיקה'); }
  }
  function quoteToReceipt(q) {
    var desc = (q.items || []).map(function (it) {
      return (it.desc || '') + (Number(it.qty) !== 1 ? ' x' + it.qty : '');
    }).filter(Boolean).join(', ');
    if (q.eventType) desc = q.eventType + (desc ? ', ' + desc : '');
    state.activeQuoteId = null;
    openNewReceipt({
      clientId: q.clientId || null, clientName: q.clientName || '', clientPhone: q.clientPhone || '', clientEmail: q.clientEmail || '',
      description: desc, amount: String(quoteTotal(q)), eventDate: q.eventDate || todayIso(), fromQuoteId: q.id
    });
  }

    var lines = [

      'תאריך: ' + fmtDate(r.issueDate),
      r.description ? 'פירוט: ' + r.description : null,
      'סכום: ' + fmtMoney(r.amount) + ' (' + (PAY_METHODS[r.method] || r.method) + ')',
      'סטטוס: ' + (r.status === 'paid' ? 'שולם' : 'ממתין לתשלום'),
      s.exemptNote || DEFAULT_EXEMPT_NOTE,
    ].filter(Boolean);
    var text = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('הטקסט הועתק'); }).catch(function () { showToast('לא ניתן להעתיק'); });
    } else { showToast('העתקה לא נתמכת כאן'); }

      opts = opts || {};
      grid.appendChild(el('div', { class: 'field' + (opts.full ? ' full' : '') }, [
        el('label', {}, [label]),
        opts.textarea
          ? el('textarea', { oninput: function (e) { draft[key] = e.target.value; } }, [draft[key] || ''])
          : el('input', {
              type: opts.type || 'text', value: draft[key] || '',
              oninput: function (e) { draft[key] = e.target.value; }
            }),
      ]));
    }
    field('שם העסק', 'businessName');
    field('שם בעל/ת העסק', 'ownerName');
    field('מספר עוסק / ת.ז', 'idNumber');
    field('טלפון', 'phone');
    field('אימייל', 'email');
    field('כתובת', 'address', { full: true });
    field('הערת עוסק פטור (מופיעה בתחתית כל קבלה)', 'exemptNote', { full: true, textarea: true });
    field('מספר הקבלה הבא שיונפק', 'startNumber', { type: 'number' });
    field('תנאים קבועים להצעות מחיר (מופיע בתחתית כל הצעה)', 'quoteTerms', { full: true, textarea: true });

    card.appendChild(grid);
    card.appendChild(el('div', { class: 'modal-actions' }, [
      el('button', { class: 'btn primary', onclick: function () { saveSettings(draft); } }, ['שמירת הגדרות']),
    ]));
    main.appendChild(card);

    main.appendChild(el('div', { class: 'section-title' }, ['גיבוי']));
    var backupCard = el('div', { class: 'card' }, [
      el('div', { style: 'color:var(--text-muted);font-size:13.5px;line-height:1.7;margin-bottom:14px' }, [
        'הנתונים שלך נשמרים אוטומטית ובבטחה בכל שינוי - לא על הטלפון או המחשב, ולא הולכים לאיבוד אם משהו קורס אצלך. בכל זאת, מומלץ להוריד גיבוי מלא מדי פעם (למשל פעם בחודש) ולשמור אותו במקום נוסף משלך, כמו במייל או בדרייב - כלל אצבע טוב לכל נתון עסקי חשוב.'
      ]),
      el('div', { class: 'modal-actions', style: 'margin-top:0' }, [
        el('button', { class: 'btn primary', onclick: downloadFullBackup }, ['הורדת גיבוי מלא ⤓']),
      ]),
    ]);
    main.appendChild(backupCard);

    main.appendChild(el('div', { class: 'section-title' }, ['חשבון']));
    main.appendChild(el('div', { class: 'card', style: 'display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap' }, [
      el('div', { style: 'font-size:13.5px;color:var(--text-muted)' }, ['מחובר בתור ' + ((state.user && state.user.email) || '')]),
      el('button', { class: 'btn ghost small', onclick: signOut }, ['התנתקות']),
    ]));
  }

  function downloadFullBackup() {
    var payload = {
      exportedAt: new Date().toISOString(),
      settings: state.settings || null,
      clients: state.clients,
      receipts: state.receipts,
      expenses: state.expenses,
      quotes: state.quotes,
    };
    var json = JSON.stringify(payload, null, 2);
    var fname = 'גיבוי-Memories4U-' + todayIso() + '.json';
    saveFile(fname, json, 'application/json;charset=utf-8')
      .then(function () {
        showToast('הגיבוי נשמר בהצלחה');
        if (state.db) state.db.doc('settings/business').update({ lastBackupAt: Date.now() }).catch(function () {});
      })
      .catch(function () { showToast('לא ניתן לשמור כרגע'); });
  }

  async function saveSettings(draft) {
    if (!state.db) { showToast('צריך להתחבר כדי לשמור'); return; }
    var body = Object.assign({}, draft);
    body.startNumber = Number(body.startNumber) || 1;
    try {
      var ref = state.db.doc('settings/business');
      var snap = await ref.get();
      if (!snap.exists) await ref.set(Object.assign({ nextNumber: body.startNumber }, body));
      else await ref.update(body);
      showToast('ההגדרות נשמרו');
    } catch (e) { showToast('שגיאה בשמירה'); }
  }

  // ---------------- setup gate ----------------
  function renderGate(main) {
    var draft = state._settingsDraft || (state._settingsDraft = {
      businessName: 'Memories4U', ownerName: 'דמרי יקיר יעקב וסורול אליעד', idNumber: '', address: '', phone: '050-9248714 + 054-6709487', email: '',
      exemptNote: DEFAULT_EXEMPT_NOTE, startNumber: 1
    });
    var wrap = el('div', { class: 'gate' }, [
      el('h1', {}, ['ברוכים הבאים 👋']),
      el('div', { class: 'lead' }, [
        'לפני שמפיקים קבלה ראשונה, בואו נמלא פעם אחת את פרטי העסק. הם יופיעו אוטומטית על כל קבלה שתפיקו.'
      ]),
    ]);
    var card = el('div', { class: 'card' }, []);
    var grid = el('div', { class: 'form-grid' }, []);
    function field(label, key, opts) {
      opts = opts || {};
      grid.appendChild(el('div', { class: 'field' + (opts.full ? ' full' : '') }, [
        el('label', {}, [label]),
        el('input', { type: opts.type || 'text', value: draft[key] || '', oninput: function (e) { draft[key] = e.target.value; } }),
      ]));
    }
    field('שם העסק', 'businessName');
    field('שם בעל/ת העסק', 'ownerName');
    field('מספר עוסק / ת.ז', 'idNumber');
    field('טלפון', 'phone');
    field('כתובת', 'address', { full: true });
    field('מספר הקבלה הראשונה', 'startNumber', { type: 'number' });
    card.appendChild(grid);
    card.appendChild(el('div', { class: 'modal-actions' }, [
      el('button', {
        class: 'btn primary',
        onclick: function () { saveSettings(Object.assign({ exemptNote: DEFAULT_EXEMPT_NOTE }, draft)); }
      }, ['התחלת עבודה']),
    ]));
    wrap.appendChild(card);
    main.appendChild(wrap);
  }

  var G_ICON = '<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';

  function renderLogin(root) {
    root.appendChild(el('div', { class: 'login' }, [
      el('div', { class: 'word' }, ['Memories4U']),
      el('div', { class: 'lead' }, ['ניהול קבלות והוצאות. הכניסה היא עם חשבון הגוגל של העסק, והנתונים נשמרים בענן כך שהם זמינים בכל מכשיר.']),
      el('button', { class: 'gbtn', onclick: signIn, html: G_ICON + '<span>כניסה עם Google</span>' }),
      state.loginError ? el('div', { class: 'err' }, [state.loginError]) : null,
    ]));
  }

  function renderDenied(root) {
    root.appendChild(el('div', { class: 'login' }, [
      el('div', { class: 'word' }, ['🔒']),
      el('div', { class: 'lead' }, [
        'החשבון ' + ((state.user && state.user.email) || '') + ' לא מורשה לגשת לנתונים של Memories4U. אם זו טעות, התנתקו והיכנסו עם חשבון הגוגל של העסק.'
      ]),
      el('button', { class: 'btn', onclick: function () { auth.signOut(); } }, ['התנתקות וכניסה עם חשבון אחר']),
    ]));
  }

  // ---------------- render root ----------------
  function render() {
    var root = document.getElementById('app');
    // שומרים על השדה שבו מקלידים ועל מיקום הגלילה בחלון פתוח, כדי שהמסך לא "יקפוץ"
    var fields = Array.prototype.slice.call(document.querySelectorAll('#app input, #app textarea, #app select'));
    var active = document.activeElement;
    var focusIdx = fields.indexOf(active);
    var focusView = state.view;
    var selStart = null, selEnd = null;
    try { if (focusIdx > -1) { selStart = active.selectionStart; selEnd = active.selectionEnd; } } catch (e) {}
    var ovScroll = {};
    ['receipt-overlay', 'quote-overlay'].forEach(function (id) {
      var o = document.getElementById(id); if (o) { ovScroll[id] = o.scrollTop; o.remove(); }
    });
    root.innerHTML = '';
    closeOverlay();
    renderInner(root);
    Object.keys(ovScroll).forEach(function (id) { var o = document.getElementById(id); if (o) o.scrollTop = ovScroll[id]; });
    if (focusIdx > -1 && focusView === state.view) {
      var nf = document.querySelectorAll('#app input, #app textarea, #app select')[focusIdx];
      if (nf && nf.tagName === active.tagName) {
        nf.focus({ preventScroll: true });
        try { if (selStart != null) nf.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }

  function renderInner(root) {

    if (!state.authChecked) { return; }
    if (!state.user) { renderLogin(root); return; }
    if (state.accessDenied) { renderDenied(root); return; }
    renderNav(root);
    var main = el('div', { class: 'main' }, []);
    root.appendChild(main);

    if (!state.settingsLoaded) { return; }
    if (!state.settings) { renderGate(main); return; }

    if (state.view === 'dashboard') renderDashboard(main);
    else if (state.view === 'receipts') renderReceiptsPage(main);
    else if (state.view === 'expenses') renderExpensesPage(main);
    else if (state.view === 'clients') renderClientsPage(main);
    else if (state.view === 'settings') renderSettingsPage(main);
    else if (state.view === 'newReceipt') renderNewReceipt(main);
    else if (state.view === 'newExpense') renderNewExpense(main);
    else if (state.view === 'quotes') renderQuotesPage(main);
    else if (state.view === 'newQuote') renderNewQuote(main);

    if (state.activeReceiptId) renderReceiptDetail();
    if (state.activeQuoteId) renderQuoteDetail();

    if (state.toast) {
      root.appendChild(el('div', {
        class: 'toast', style: 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;z-index:60'
      }, [state.toast]));
    }
  }

  boot();
})();
</script>

</body></html>
