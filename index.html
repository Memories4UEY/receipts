<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F1D33">
<title>קבלות Memories4U</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
  :root {
    --bg: #F4F5F8;
    --panel: #FFFFFF;
    --panel-2: #F7F8FA;
    --ink: #0F1D33;
    --ink-2: #3E4A62;
    --muted: #737D92;
    --line: #E3E6EC;
    --line-2: #EEF0F4;
    --blue: #2347D8;
    --blue-ink: #1A36A6;
    --blue-wash: #EDF1FE;
    --navy: #0F1D33;
    --navy-2: #1A2B47;
    --paid: #137A4C;
    --paid-wash: #E6F4EC;
    --pending: #B25B00;
    --pending-wash: #FDF1E2;
    --danger: #C2362B;
    --danger-wash: #FCEBE9;
    --focus: 0 0 0 3px rgba(35, 71, 216, .28);
    --r-lg: 16px;
    --r-md: 10px;
    --r-sm: 7px;
    --lift: 0 1px 2px rgba(15, 29, 51, .05), 0 1px 1px rgba(15, 29, 51, .03);
    --float: 0 24px 60px -18px rgba(15, 29, 51, .35), 0 2px 6px rgba(15, 29, 51, .06);
    /* legacy names used in inline styles */
    --text: var(--ink);
    --text-muted: var(--muted);
    --gold: var(--blue);
    --surface-3: var(--line-2);
    --border: var(--line);
    --shadow: var(--float);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    color: var(--ink); margin: 0;
    font-family: 'IBM Plex Sans Hebrew', 'Segoe UI', system-ui, sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  #app { direction: rtl; min-height: 100vh; display: flex; background: var(--bg); }
  h1, h2, h3 { font-family: inherit; margin: 0; letter-spacing: -.01em; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  ::selection { background: rgba(35, 71, 216, .18); }
  :focus-visible { outline: none; box-shadow: var(--focus); }
  .ic { display: inline-flex; width: 18px; height: 18px; flex: 0 0 auto; }
  .ic svg { width: 100%; height: 100%; }
  .num-font { font-variant-numeric: tabular-nums; }

  /* ---------- Nav ---------- */
  .nav {
    width: 248px; flex: 0 0 248px; background: var(--navy); color: #fff;
    padding: 26px 16px 20px; display: flex; flex-direction: column; gap: 30px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; flex-direction: column; gap: 3px; padding: 0 10px; }
  .brand .word { font-size: 21px; font-weight: 700; letter-spacing: -.02em; color: #fff; direction: ltr; text-align: right; }
  .brand .word b { color: #8EA6FF; font-weight: 700; }
  .brand .sub { font-size: 12.5px; color: rgba(255, 255, 255, .55); }
  .nav-links { display: flex; flex-direction: column; gap: 2px; }
  .nav-link {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--r-md);
    color: rgba(255, 255, 255, .72); background: transparent; border: none;
    font-size: 14.5px; font-weight: 500; cursor: pointer; text-align: right; width: 100%;
  }
  .nav-link .ic { width: 19px; height: 19px; opacity: .85; }
  .nav-link:hover { background: rgba(255, 255, 255, .06); color: #fff; }
  .nav-link.active { background: rgba(142, 166, 255, .16); color: #fff; }
  .nav-link.active .ic { opacity: 1; color: #A9BBFF; }
  .nav-spacer { flex: 1; }
  .nav-cta {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--blue); color: #fff; border: none; border-radius: var(--r-md);
    padding: 12px; font-weight: 600; font-size: 14.5px; cursor: pointer;
  }
  .nav-cta:hover { background: #2E54EA; }
  .nav-cta:active { transform: translateY(1px); }
  .nav-user { font-size: 12px; color: rgba(255, 255, 255, .45); padding: 0 10px; direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: 36px 44px 72px; max-width: 1240px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 26px; flex-wrap: wrap; }
  .page-head h1 { font-size: 28px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .page-head .hint { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .page-head .actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: var(--r-md); border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 9px 15px; font-size: 14px; font-weight: 500; cursor: pointer; line-height: 1.3;
    box-shadow: var(--lift); text-decoration: none;
  }
  .btn .ic { width: 17px; height: 17px; }
  .btn:hover { border-color: #CDD2DC; background: var(--panel-2); }
  .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 1px 2px rgba(35, 71, 216, .35); }
  .btn.primary:hover { background: #2E54EA; }
  .btn.ghost { background: var(--panel); }
  .btn.quiet { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-2); }
  .btn.quiet:hover { background: var(--line-2); }
  .btn.danger { background: var(--panel); color: var(--danger); border-color: #F1C9C5; }
  .btn.danger:hover { background: var(--danger-wash); }
  .btn.wa { background: #1FA855; border-color: #1FA855; color: #fff; }
  .btn.wa:hover { background: #22B85D; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { padding: 6px 11px; font-size: 13px; }
  .btn:active:not(:disabled) { transform: translateY(1px); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--lift); }
  .section-title { font-size: 16px; font-weight: 600; margin: 34px 0 12px; color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .section-title .link { font-size: 13.5px; font-weight: 500; color: var(--blue); background: none; border: none; cursor: pointer; padding: 4px; }
  .section-title .link:hover { text-decoration: underline; }

  /* ---------- Dashboard ---------- */
  .hero { display: grid; grid-template-columns: 1.35fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--lift); overflow: hidden; }
  .hero-main { padding: 28px 30px 26px; }
  .hero-label { font-size: 14px; color: var(--muted); }
  .hero-value { font-size: 52px; font-weight: 300; letter-spacing: -.03em; line-height: 1.1; margin: 8px 0 22px; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
  .hero-value.neg { color: var(--danger); }
  .split { height: 10px; border-radius: 99px; background: var(--line-2); display: flex; overflow: hidden; gap: 2px; }
  .split .in { background: var(--blue); }
  .split .out { background: #A9B4C8; }
  .split-legend { display: flex; gap: 26px; margin-top: 14px; flex-wrap: wrap; }
  .split-legend .it { display: flex; flex-direction: column; gap: 2px; }
  .split-legend .k { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .split-legend .k::before { content: ''; width: 8px; height: 8px; border-radius: 2px; background: var(--blue); }
  .split-legend .it.out .k::before { background: #A9B4C8; }
  .split-legend .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hero-side { border-inline-start: 1px solid var(--line); display: grid; grid-template-rows: 1fr 1fr; }
  .hero-stat { padding: 22px 26px; display: flex; flex-direction: column; justify-content: center; gap: 4px; background: none; border: none; text-align: right; cursor: pointer; }
  .hero-stat + .hero-stat { border-top: 1px solid var(--line); }
  .hero-stat:hover { background: var(--panel-2); }
  .hero-stat .k { font-size: 13.5px; color: var(--muted); }
  .hero-stat .v { font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .hero-stat .s { font-size: 13px; color: var(--muted); }
  .hero-stat.pending .v { color: var(--pending); }

  .events { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .event {
    display: flex; gap: 14px; align-items: center; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 12px 14px; cursor: pointer; text-align: right; box-shadow: var(--lift);
  }
  .event:hover { border-color: #CDD2DC; }
  .tear { width: 54px; flex: 0 0 54px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); text-align: center; background: #fff; }
  .tear .m { background: var(--blue); color: #fff; font-size: 11.5px; font-weight: 600; padding: 3px 0; }
  .tear .d { font-size: 22px; font-weight: 600; line-height: 1.35; font-variant-numeric: tabular-nums; }
  .event .who { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event .what { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .event .body { min-width: 0; flex: 1; }
  .event .in-days { font-size: 12px; color: var(--blue); font-weight: 600; }

  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .notice {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    background: var(--blue-wash); border: 1px solid #D6DEFB; color: var(--ink-2);
    border-radius: var(--r-md); padding: 12px 16px; margin-bottom: 20px; font-size: 14px;
  }
  .notice .ic { color: var(--blue); }
  .notice .txt { display: flex; align-items: center; gap: 10px; }

  /* ---------- Tables ---------- */
  .tbl { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--lift); overflow: hidden; }
  .tr { display: grid; align-items: center; gap: 14px; padding: 13px 20px; border-top: 1px solid var(--line-2); }
  .tbl .tr:first-child { border-top: none; }
  .tr.th { font-size: 12.5px; color: var(--muted); font-weight: 500; padding-top: 11px; padding-bottom: 11px; background: var(--panel-2); border-bottom: 1px solid var(--line); }
  .tr.th + .tr { border-top: none; }
  .tr.row { cursor: pointer; }
  .tr.row:hover { background: #FAFBFD; }
  .tbl.receipts .tr, .tbl.quotes .tr { grid-template-columns: 56px minmax(0, 1fr) 96px 92px 110px; }
  .tbl.compact .tr { grid-template-columns: 48px minmax(0, 1fr) 84px 104px; }
  .tbl.compact .c-date { display: none; }
  .tbl.expenses .tr { grid-template-columns: minmax(0, 1fr) 150px 96px 110px 40px; }
  .tbl.clients .tr { grid-template-columns: minmax(0, 1fr) 150px 90px 120px; }
  .c-num { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .c-main { min-width: 0; }
  .c-main .n { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-main .d { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .c-date, .c-cat { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .c-amt { font-weight: 600; font-variant-numeric: tabular-nums; text-align: left; font-size: 15px; }
  .c-amt.neg { color: var(--ink-2); font-weight: 500; }
  .tr.th .c-amt { font-weight: 500; font-size: 12.5px; }
  .c-act { display: flex; justify-content: flex-end; }
  .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--danger-wash); color: var(--danger); }
  .icon-btn .ic { width: 17px; height: 17px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 3px 10px 3px 9px; border-radius: 99px; white-space: nowrap; justify-self: start; width: max-content; }
  .chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .chip.paid { background: var(--paid-wash); color: var(--paid); }
  .chip.pending { background: var(--pending-wash); color: var(--pending); }
  .chip.draft { background: var(--line-2); color: var(--ink-2); }
  .chip.sent { background: var(--blue-wash); color: var(--blue); }
  .chip.declined { background: var(--danger-wash); color: var(--danger); }

  .empty { text-align: center; padding: 44px 24px; color: var(--muted); background: var(--panel); border: 1px dashed #D3D8E1; border-radius: var(--r-lg); font-size: 14.5px; }
  .empty .big { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 12px; background: var(--blue-wash); color: var(--blue); display: flex; align-items: center; justify-content: center; }
  .empty .big .ic { width: 22px; height: 22px; }
  .empty .ttl { color: var(--ink); font-weight: 600; font-size: 15.5px; margin-bottom: 4px; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap .ic { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search {
    width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 10px 40px 10px 14px; color: var(--ink); font-size: 14.5px; box-shadow: var(--lift);
  }
  .search::placeholder { color: #9AA3B5; }
  .search:focus { outline: none; border-color: var(--blue); box-shadow: var(--focus); }
  .seg { display: inline-flex; background: var(--line-2); border-radius: var(--r-md); padding: 3px; gap: 2px; }
  .seg button { border: none; background: transparent; padding: 7px 13px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--lift); }

  /* ---------- Forms ---------- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
  .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 13.5px; color: var(--ink-2); font-weight: 500; }
  .field input, .field select, .field textarea {
    background: var(--panel); border: 1px solid #D6DAE2; border-radius: var(--r-md);
    padding: 11px 13px; color: var(--ink); font-size: 15px; width: 100%;
  }
  .field input::placeholder, .field textarea::placeholder, .item-row input::placeholder { color: #A2AABA; }
  .field input:focus, .field select:focus, .field textarea:focus, .item-row input:focus, .q-sum-row input:focus { outline: none; border-color: var(--blue); box-shadow: var(--focus); }
  .field textarea { resize: vertical; min-height: 76px; line-height: 1.55; }
  .amount-wrap { position: relative; }
  .amount-wrap .sign { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .amount-wrap input { padding-right: 30px; font-variant-numeric: tabular-nums; }
  .form-card { max-width: 860px; }
  .form-sec { font-size: 15px; font-weight: 600; margin: 8px 0 14px; color: var(--ink); }
  .form-sec + .form-grid { margin-top: 0; }
  .form-divider { height: 1px; background: var(--line); margin: 8px -24px 22px; }

  .chip-toggle { display: flex; gap: 6px; background: var(--line-2); padding: 3px; border-radius: var(--r-md); }
  .chip-toggle button { flex: 1; padding: 9px; border-radius: 8px; border: none; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 14px; font-weight: 500; }
  .chip-toggle button.active { background: var(--panel); box-shadow: var(--lift); }
  .chip-toggle button.active.paid { color: var(--paid); }
  .chip-toggle button.active.pending { color: var(--pending); }

  .autocomplete { position: relative; }
  .ac-list { position: absolute; top: calc(100% + 6px); right: 0; left: 0; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); max-height: 240px; overflow-y: auto; box-shadow: var(--float); padding: 4px; }
  .ac-item { padding: 9px 11px; cursor: pointer; font-size: 14.5px; border-radius: 7px; }
  .ac-item:hover { background: var(--panel-2); }
  .ac-item .n { font-weight: 600; }
  .ac-item .p { color: var(--muted); font-size: 12.5px; direction: ltr; text-align: right; }
  .ac-new { color: var(--blue); font-weight: 500; }

  /* ---------- Drawer ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(15, 29, 51, .42); display: flex; justify-content: flex-end; align-items: flex-start; z-index: 40; overflow-y: auto; }
  .modal { background: var(--bg); width: 100%; max-width: 640px; min-height: 100vh; padding: 22px 28px 40px; box-shadow: var(--float); }
  .overlay:not(.no-anim) { animation: fade .18s ease-out; }
  .overlay:not(.no-anim) .modal { animation: slide .26s cubic-bezier(.2, .8, .2, 1); }
  @keyframes fade { from { background: rgba(15, 29, 51, 0); } }
  @keyframes slide { from { transform: translateX(-40px); opacity: .4; } }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }
  .modal-head h2 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .close-x { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .close-x:hover { background: var(--line-2); }
  .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .modal-actions select.btn { appearance: none; -webkit-appearance: none; padding-left: 15px; }
  .send-label { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 22px; }
  .action-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 4px 18px 18px; margin-top: 18px; box-shadow: var(--lift); }
  .action-panel .send-label { margin-top: 14px; }
  .client-kpis { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 12px; margin: 4px 0 20px; }
  .client-kpis .card { padding: 16px 18px; }
  .client-kpis .k { font-size: 13px; color: var(--muted); }
  .client-kpis .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }

  /* ---------- Paper sheet (documents) ---------- */
  .sheet { position: relative; background: #fff; border-radius: 6px 6px 0 0; box-shadow: 0 1px 2px rgba(15, 29, 51, .06), 0 18px 40px -20px rgba(15, 29, 51, .28); margin-bottom: 14px; }
  .sheet::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -9px; height: 10px;
    background: radial-gradient(circle at 7px 0, transparent 5.5px, #fff 6px) 0 0 / 14px 10px repeat-x;
    filter: drop-shadow(0 3px 2px rgba(15, 29, 51, .07));
  }
  .sheet .receipt-doc { border: none; border-radius: 6px 6px 0 0; }

  .receipt-doc { background: #fff; color: #0F1D33; border-radius: 12px; padding: 34px 32px 30px; font-family: 'IBM Plex Sans Hebrew', sans-serif; border: 1px solid #E3E6EC; }
  .receipt-doc .rd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; padding-bottom: 20px; margin-bottom: 18px; border-bottom: 1px solid #E3E6EC; }
  .receipt-doc .rd-brand { font-size: 21px; font-weight: 700; color: #0F1D33; letter-spacing: -.02em; direction: ltr; text-align: right; }
  .receipt-doc .rd-brand b { color: #2347D8; }
  .receipt-doc .rd-biz { font-size: 12px; color: #737D92; margin-top: 6px; line-height: 1.7; max-width: 330px; }
  .receipt-doc .rd-title { text-align: left; }
  .receipt-doc .rd-title .t { font-size: 19px; font-weight: 600; color: #2347D8; }
  .receipt-doc .rd-title .n { font-size: 13px; color: #737D92; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .receipt-doc .rd-row { display: flex; justify-content: space-between; gap: 16px; font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid #EEF0F4; }
  .receipt-doc .rd-row .k { color: #737D92; }
  .receipt-doc .rd-row .v { font-weight: 500; text-align: left; }
  .receipt-doc .rd-desc { font-size: 13.5px; margin: 16px 0; line-height: 1.65; background: #F4F5F8; border-radius: 8px; padding: 12px 14px; white-space: pre-line; }
  .receipt-doc .rd-amount { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; padding: 16px 18px; background: #EDF1FE; border-radius: 10px; }
  .receipt-doc .rd-amount .k { font-size: 14.5px; font-weight: 600; color: #1A36A6; }
  .receipt-doc .rd-amount .v { font-size: 28px; font-weight: 600; color: #1A36A6; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .receipt-doc .rd-foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid #EEF0F4; font-size: 11px; color: #8C95A8; text-align: center; line-height: 1.6; }

  async function saveNewReceipt() {
    var d = state.newReceiptDraft;
    if (state.saving) return;
    if (!d.clientName.trim()) { showToast('צריך למלא שם לקוח'); return; }
    if (!(Number(d.amount) > 0)) { showToast('צריך למלא סכום גדול מ-0'); return; }
    if (d.clientEmail && !isEmail(d.clientEmail)) { showToast('כתובת המייל לא תקינה'); return; }
    if (!state.db) { showToast('צריך להתחבר כדי לשמור'); return; }
    state.saving = true; render();
    try {
      var clientId = await ensureClient(d);
      var fq2 = d.fromQuoteId ? state.quotes.find(function (x) { return x.id === d.fromQuoteId; }) : null;
      var receiptRef = state.db.collection('receipts').doc();
      var number = await state.db.runTransaction(function (tx) {
        var sref = state.db.doc('settings/business');
        return tx.get(sref).then(function (snap) {
          var sd = snap.exists ? snap.data() : {};
          var n = Number(sd.nextNumber) || Number(sd.startNumber) || 1;
          tx.set(sref, { nextNumber: n + 1 }, { merge: true });
          if (fq2) tx.update(state.db.doc('quotes/' + d.fromQuoteId), { status: 'approved', receiptId: receiptRef.id });
          tx.set(receiptRef, {
            number: n, clientId: clientId, clientName: d.clientName.trim(),
            clientPhone: d.clientPhone || '', clientEmail: (d.clientEmail || '').trim(), description: d.description || '',
            amount: Number(d.amount), method: d.method, status: d.status, fromQuoteId: d.fromQuoteId || null,
            kind: d.kind || null, quoteNumber: fq2 ? fq2.number : null,
            dealTotal: fq2 ? quoteTotal(fq2) : null,
            balanceAfter: fq2 ? Math.max(0, quoteTotal(fq2) - quotePaid(fq2) - (d.status === 'paid' ? Number(d.amount) : 0)) : null,
            eventDate: d.eventDate, issueDate: d.issueDate, notes: d.notes || '',
            createdAt: Date.now(), createdBy: (state.user && state.user.email) || ''
          });
          return n;
        });
      });
      state.saving = false;
      state.view = 'receipts';
      state.activeReceiptId = receiptRef.id;
      render();
      showToast('הקבלה מס\' ' + number + ' נוצרה');
    } catch (e) {
      state.saving = false; render();
      showToast('שגיאה ביצירת הקבלה, נסו שוב');
    }
  }

  var libsPromise = null;

  // מכין את ה-PDF מראש כשהמסמך נפתח, כדי שכפתורי השליחה יעבדו מיד גם באייפד ובטלפון
  function getPdf(key, buildFn) {
    var entry = pdfCache[key];
    if (entry) return entry;
    entry = pdfCache[key] = { blob: null, error: null };
    makePdf(buildFn).then(function (blob) {
      entry.blob = blob; render();
    }).catch(function () {
      entry.error = true; render();
      setTimeout(function () { if (pdfCache[key] === entry) delete pdfCache[key]; }, 3000);
    });
    return entry;
  }

  var pdfQueue = Promise.resolve();
  function makePdf(buildFn) {
    var job = pdfQueue.then(function () { return makePdfNow(buildFn); });
    pdfQueue = job.catch(function () {});
    return job;
  }
  async function makePdfNow(buildFn) {
    await loadPdfLibs();
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    var holder = el('div', { dir: 'rtl', class: 'pdf-holder', style: 'position:fixed;left:-10000px;top:0;width:760px;background:#fff;padding:36px;font-family:Heebo,sans-serif' }, [buildFn()]);
    document.body.appendChild(holder);
    try {
      var canvas = await window.html2canvas(holder, { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false });
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
      var pageW = 210, pageH = 297, margin = 10;
      var w = pageW - margin * 2;
      var h = canvas.height * w / canvas.width;
      var maxH = pageH - margin * 2;
      if (h <= maxH) {
        doc.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, w, h);
      } else {
        // מסמך ארוך, מחלקים לכמה עמודים
        var sliceH = Math.floor(canvas.width * maxH / w);
        for (var y = 0, page = 0; y < canvas.height; y += sliceH, page++) {
          var part = document.createElement('canvas');
          part.width = canvas.width; part.height = Math.min(sliceH, canvas.height - y);
          var ctx = part.getContext('2d');

          ctx.drawImage(canvas, 0, y, canvas.width, part.height, 0, 0, canvas.width, part.height);
          if (page) doc.addPage();
          doc.addImage(part.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, w, part.height * w / canvas.width);
        }
      }
      return doc.output('blob');
    } finally {
      holder.remove();
    }
  }

  function sendDoc(channel, o) {

  async function saveQuote() {
    var d = state.quoteDraft;
    if (state.saving) return;
    if (!d.clientName.trim()) { showToast('צריך למלא שם לקוח'); return; }
    var items = d.items.filter(function (it) { return (it.desc || '').trim() || Number(it.price) > 0; })
      .map(function (it) { return { desc: (it.desc || '').trim(), qty: Number(it.qty) || 0, price: Number(it.price) || 0 }; });
    if (!items.length) { showToast('צריך להוסיף לפחות פריט אחד'); return; }
    if (d.clientEmail && !isEmail(d.clientEmail)) { showToast('כתובת המייל לא תקינה'); return; }
    if (!state.db) { showToast('צריך להתחבר כדי לשמור'); return; }
    state.saving = true; render();
    try {
      var clientId = await ensureClient(d);
      var body = {
        clientId: clientId, clientName: d.clientName.trim(), clientPhone: d.clientPhone || '', clientEmail: (d.clientEmail || '').trim(),
        eventType: d.eventType || '', eventDate: d.eventDate || '', location: d.location || '',
        items: items, discount: Number(d.discount) || 0, deposit: Number(d.deposit) || 0,
        issueDate: d.issueDate || todayIso(), validUntil: d.validUntil || '', notes: d.notes || '',
        updatedAt: Date.now()
      };
      var id = d.id, number;
      if (id) {
        await state.db.doc('quotes/' + id).update(body);
      } else {
        var ref = state.db.collection('quotes').doc();
        id = ref.id;
        number = await state.db.runTransaction(function (tx) {
          var sref = state.db.doc('settings/business');
          return tx.get(sref).then(function (snap) {
            var n = Number((snap.exists ? snap.data() : {}).quoteNextNumber) || 1;
            tx.set(sref, { quoteNextNumber: n + 1 }, { merge: true });
            tx.set(ref, Object.assign({ number: n, status: 'draft', createdAt: Date.now() }, body));
            return n;
          });
        });
      }
      state.saving = false;
      state.view = 'quotes';
      state.activeQuoteId = id;
      render();
      showToast(number ? 'הצעת מחיר מס\' ' + number + ' נוצרה' : 'ההצעה עודכנה');
    } catch (e) {
      state.saving = false; render();
      showToast('שגיאה בשמירת ההצעה, נסו שוב');
    }
  }

  function quoteToReceipt(q, kind) {
    var event = [q.eventType, q.eventDate ? 'ב-' + fmtDate(q.eventDate) : ''].filter(Boolean).join(' ');
    var ref = 'הצעת מחיר מס\' ' + q.number + (event ? ', ' + event : '');
    var desc, amount;
    if (kind === 'deposit') {
      desc = 'מקדמה לשריון התאריך עבור ' + ref;
      amount = Number(q.deposit) > 0 ? String(Math.min(Number(q.deposit), quoteBalance(q))) : '';
    } else if (kind === 'balance') {
      desc = 'יתרת תשלום עבור ' + ref;
      amount = String(quoteBalance(q));
    } else {
      desc = (q.items || []).map(function (it) {
        return (it.desc || '') + (Number(it.qty) !== 1 ? ' x' + it.qty : '');
      }).filter(Boolean).join(', ');
      if (q.eventType) desc = q.eventType + (desc ? ', ' + desc : '');
      amount = String(quoteBalance(q));
    }
    state.activeQuoteId = null;
    openNewReceipt({
      clientId: q.clientId || null, clientName: q.clientName || '', clientPhone: q.clientPhone || '', clientEmail: q.clientEmail || '',
      description: desc, amount: amount, eventDate: q.eventDate || todayIso(), fromQuoteId: q.id, kind: kind || 'full'
    });
  }

    field('שם העסק', 'businessName');
    field('שם בעל/ת העסק', 'ownerName');
    field('מספר עוסק / ת.ז', 'idNumber');
    field('טלפון', 'phone');
    field('כתובת', 'address', { full: true });
    field('מספר הקבלה הראשונה', 'startNumber', { type: 'number' });
    card.appendChild(grid);
    card.appendChild(el('div', { class: 'modal-actions' }, [
      el('button', {
        class: 'btn primary',
        onclick: function () { saveSettings(Object.assign({ exemptNote: DEFAULT_EXEMPT_NOTE }, draft)); }
      }, ['התחלת עבודה']),
    ]));
    wrap.appendChild(card);
    main.appendChild(wrap);
  }

  var G_ICON = '<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';

  function loginArt() {
    return el('div', { class: 'login-art' }, [
      el('div', { class: 'word' }, brandMark('Memories4U')),
      el('div', { class: 'strip', 'aria-hidden': 'true' }, [el('i'), el('i'), el('i')]),
      el('div', { class: 'big' }, ['קבלות, הצעות מחיר והוצאות של העסק, במקום אחד.']),
    ]);
  }
  function renderLogin(root) {
    root.appendChild(el('div', { class: 'login-wrap' }, [
      loginArt(),
      el('div', { class: 'login' }, [
        el('h1', {}, ['כניסה למערכת']),
        el('div', { class: 'lead' }, ['נכנסים עם חשבון הגוגל של העסק. הנתונים נשמרים בענן ומסונכרנים בין הטלפון, האייפד והמחשב.']),
        el('button', { class: 'gbtn', onclick: signIn, html: G_ICON + '<span>כניסה עם Google</span>' }),
        state.loginError ? el('div', { class: 'err', role: 'alert' }, [state.loginError]) : null,
        el('div', { class: 'fine' }, [icon('shield'), 'רק החשבון המורשה של העסק יכול לראות את הנתונים.']),
      ]),
    ]));
  }

  function renderDenied(root) {
    root.appendChild(el('div', { class: 'login-wrap' }, [
      loginArt(),
      el('div', { class: 'login' }, [
        el('h1', {}, ['אין הרשאה לחשבון הזה']),
        el('div', { class: 'lead', dir: 'rtl' }, ['החשבון ' + ((state.user && state.user.email) || '') + ' לא מורשה לגשת לנתונים. צריך להתנתק ולהיכנס עם חשבון הגוגל של העסק.']),
        btn('primary', 'logout', 'התנתקות וכניסה עם חשבון אחר', function () { auth.signOut(); }),
      ]),
    ]));
  }

  // ---------------- render root ----------------
  function render() {
    var root = document.getElementById('app');
    // שומרים על השדה שבו מקלידים ועל מיקום הגלילה בחלון פתוח, כדי שהמסך לא "יקפוץ"
    var fields = Array.prototype.slice.call(document.querySelectorAll('#app input, #app textarea, #app select'));
    var active = document.activeElement;
    var focusIdx = fields.indexOf(active);
    var focusView = state.view;
    var selStart = null, selEnd = null;
    try { if (focusIdx > -1) { selStart = active.selectionStart; selEnd = active.selectionEnd; } } catch (e) {}
    var ovScroll = {};
    ['receipt-overlay', 'quote-overlay', 'client-overlay'].forEach(function (id) {
      var o = document.getElementById(id); if (o) { ovScroll[id] = o.scrollTop; o.remove(); }
    });
    root.innerHTML = '';
    closeOverlay();
    renderInner(root);
    Object.keys(ovScroll).forEach(function (id) { var o = document.getElementById(id); if (o) { o.classList.add('no-anim'); o.scrollTop = ovScroll[id]; } });
    document.body.style.overflow = document.querySelector('.overlay') ? 'hidden' : '';
    if (focusIdx > -1 && focusView === state.view) {
      var nf = document.querySelectorAll('#app input, #app textarea, #app select')[focusIdx];
      if (nf && nf.tagName === active.tagName) {
        nf.focus({ preventScroll: true });
        try { if (selStart != null) nf.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }

  function renderInner(root) {

    if (!state.authChecked) { return; }
    if (!state.user) { renderLogin(root); return; }
    if (state.accessDenied) { renderDenied(root); return; }
    renderNav(root);
    var main = el('div', { class: 'main' }, []);
    root.appendChild(main);

    if (!state.settingsLoaded) { return; }
    if (!state.settings) { renderGate(main); return; }

    if (state.view === 'dashboard') renderDashboard(main);
    else if (state.view === 'receipts') renderReceiptsPage(main);
    else if (state.view === 'expenses') renderExpensesPage(main);
    else if (state.view === 'clients') renderClientsPage(main);
    else if (state.view === 'settings') renderSettingsPage(main);
    else if (state.view === 'newReceipt') renderNewReceipt(main);
    else if (state.view === 'newExpense') renderNewExpense(main);
    else if (state.view === 'quotes') renderQuotesPage(main);
    else if (state.view === 'newQuote') renderNewQuote(main);

    if (state.activeClientId) renderClientDetail();
    if (state.activeReceiptId) renderReceiptDetail();
    if (state.activeQuoteId) renderQuoteDetail();

    if (state.toast) {
      root.appendChild(el('div', { class: 'toast', role: 'status' }, [state.toast]));
    }
  }

  boot();
})();
</script>
