<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>קבלות Memories4U</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
  :root {
    --ink: #FAF9F5;
    --surface: #FFFFFF;
    --surface-2: #F1F2F4;
    --surface-3: #E6E8EB;
    --gold: #2563EB;
    --gold-bright: #2563EB;
    --gold-deep: #1D4ED8;
    --gold-soft: rgba(37, 99, 235, .10);
    --text: #16181D;
    --text-muted: #6B7280;
    --border: rgba(17, 24, 39, .12);
    --border-soft: rgba(17, 24, 39, .07);
    --paid: #4E8A5B;
    --paid-soft: rgba(78, 138, 91, .12);
    --pending: #D97706;
    --pending-soft: rgba(217, 119, 6, .12);
    --danger: #DC2626;
    --danger-soft: rgba(220, 38, 38, .10);
    --shadow: 0 10px 30px rgba(15, 23, 42, .12);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ink);
    color: var(--text);
    margin: 0;
  }
  #app {
    direction: rtl;
    font-family: 'Heebo', 'Segoe UI', sans-serif;
    min-height: 100%;
    display: flex;
    background: var(--ink);
  }
  h1, h2, h3, .display { font-family: 'Frank Ruhl Libre', serif; }
  button, input, select, textarea { font-family: inherit; }
  ::selection { background: var(--gold-soft); }

  /* ---------- Nav ---------- */
  .nav {
    width: 220px;
    flex: 0 0 220px;
    background: var(--surface);
    border-left: 1px solid var(--border-soft);
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0 6px;
  }
  .brand .word {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 21px;
    font-weight: 700;
    color: var(--gold-bright);
    letter-spacing: .02em;
  }
  .brand .sub {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: .06em;
  }
  .nav-links { display: flex; flex-direction: column; gap: 4px; }
  .nav-link {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 10px;
    color: var(--text-muted); background: transparent; border: none;
    font-size: 14.5px; cursor: pointer; text-align: right; width: 100%;
  }
  .nav-link .ic { font-size: 16px; width: 20px; text-align: center; }
  .nav-link:hover { background: var(--surface-2); color: var(--text); }
  .nav-link.active { background: var(--gold-soft); color: var(--gold); font-weight: 600; }
  .nav-spacer { flex: 1; }
  .nav-cta {
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #ffffff; border: none; border-radius: 10px;
    padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer;
  }
  .nav-cta:active { transform: scale(.98); }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: 28px 34px 60px; }
  .page-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .page-head h1 { font-size: 26px; margin: 0; color: var(--text); font-weight: 700; }
  .page-head .hint { color: var(--text-muted); font-size: 13.5px; margin-top: 4px; }

  .btn {
    border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    padding: 10px 16px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { background: var(--surface-3); }
  .btn.primary {
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    color: #ffffff; border: none;
  }
  .btn.ghost { background: transparent; border: 1px solid var(--border); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(220,38,38,.35); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { padding: 7px 12px; font-size: 12.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius); padding: 18px 20px;
  }

  /* ---------- Dashboard ---------- */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .kpi { padding: 18px 20px; }
  .kpi .label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
  .kpi .value { font-family: 'Frank Ruhl Libre', serif; font-size: 28px; font-weight: 700; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
  .kpi .value.small { font-size: 22px; }
  .kpi.pending .value { color: var(--pending); }

  .section-title { font-size: 15px; font-weight: 700; margin: 26px 0 12px; color: var(--text); }

  /* ---------- Table / list ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: 12px; padding: 13px 16px; cursor: pointer;
  }
  .row-card:hover { border-color: var(--border); }
  .row-num {
    font-family: 'Frank Ruhl Libre', serif; font-weight: 700; color: var(--gold);
    font-size: 14px; width: 46px; flex: 0 0 auto; font-variant-numeric: tabular-nums;
  }
  .row-main { flex: 1; min-width: 0; }
  .row-main .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-main .desc { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-amount { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; flex: 0 0 auto; }
  .row-date { color: var(--text-muted); font-size: 12px; flex: 0 0 auto; width: 78px; text-align: center; }
  .chip { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; flex: 0 0 auto; }
  .chip.paid { background: var(--paid-soft); color: var(--paid); }
  .chip.pending { background: var(--pending-soft); color: var(--pending); }
  .empty {
    text-align: center; padding: 50px 20px; color: var(--text-muted);
    border: 1px dashed var(--border); border-radius: var(--radius); font-size: 14px;
  }
  .empty .big { font-size: 34px; margin-bottom: 10px; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 180px; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px;
  }
  .search::placeholder { color: var(--text-muted); }

  /* ---------- Forms ---------- */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field.full { grid-column: 1 / -1; }
  .field label { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
  .field input, .field select, .field textarea {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 13px; color: var(--text); font-size: 15px;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 1.5px solid var(--gold); border-color: var(--gold); }
  .field textarea { resize: vertical; min-height: 64px; font-family: inherit; }
  .amount-wrap { position: relative; }
  .amount-wrap .sign { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .amount-wrap input { padding-right: 30px; font-variant-numeric: tabular-nums; }

  .chip-toggle { display: flex; gap: 8px; }
  .chip-toggle button {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-muted); cursor: pointer; font-size: 13.5px; font-weight: 600;
  }
  .chip-toggle button.active.paid { background: var(--paid-soft); color: var(--paid); border-color: rgba(124,154,99,.4); }
  .chip-toggle button.active.pending { background: var(--pending-soft); color: var(--pending); border-color: rgba(207,154,74,.4); }

  .autocomplete { position: relative; }
  .ac-list {
    position: absolute; top: calc(100% + 4px); right: 0; left: 0; z-index: 5;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    max-height: 220px; overflow-y: auto; box-shadow: var(--shadow);
  }
  .ac-item { padding: 10px 13px; cursor: pointer; font-size: 14px; }
  .ac-item:hover { background: var(--surface-3); }
  .ac-item .n { font-weight: 600; }
  .ac-item .p { color: var(--text-muted); font-size: 12px; }
  .ac-new { color: var(--gold); font-weight: 600; }

  /* ---------- Modal / receipt ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; z-index: 40; overflow-y: auto;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; max-width: 560px; width: 100%; box-shadow: var(--shadow);
    padding: 26px;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .modal-head h2 { margin: 0; font-size: 20px; }
  .close-x { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; }

  .receipt-doc {
    background: #ffffff; color: #16181d; border-radius: 12px; padding: 26px 24px;
    font-family: 'Heebo', sans-serif; border: 1px solid #e5e7eb;
  }
  .receipt-doc .rd-head { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #2563eb; padding-bottom: 14px; margin-bottom: 16px; }
  .receipt-doc .rd-brand { font-family: 'Frank Ruhl Libre', serif; font-size: 20px; font-weight: 700; color: #1d4ed8; }
  .receipt-doc .rd-biz { font-size: 12px; color: #6b7280; margin-top: 4px; line-height: 1.6; }
  .receipt-doc .rd-title { text-align: left; }
  .receipt-doc .rd-title .t { font-family: 'Frank Ruhl Libre', serif; font-size: 17px; font-weight: 700; }
  .receipt-doc .rd-title .n { font-size: 13px; color: #6b7280; margin-top: 2px; }
  .receipt-doc .rd-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 7px 0; border-bottom: 1px solid #e5e7eb; }
  .receipt-doc .rd-row .k { color: #6b7280; }
  .receipt-doc .rd-row .v { font-weight: 600; }
  .receipt-doc .rd-desc { font-size: 13.5px; margin: 14px 0; line-height: 1.6; background: #f3f4f6; border-radius: 8px; padding: 12px 14px; }
  .receipt-doc .rd-amount { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; padding-top: 14px; border-top: 2px solid #2563eb; }
  .receipt-doc .rd-amount .k { font-size: 14px; font-weight: 700; }
  .receipt-doc .rd-amount .v { font-family: 'Frank Ruhl Libre', serif; font-size: 26px; font-weight: 700; color: #1d4ed8; font-variant-numeric: tabular-nums; }
  .receipt-doc .rd-foot { margin-top: 16px; font-size: 10.5px; color: #9ca3af; text-align: center; }

  .modal-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

  /* ---------- Setup gate ---------- */
  .gate { max-width: 560px; margin: 40px auto; }
  .gate .lead { color: var(--text-muted); font-size: 14.5px; line-height: 1.7; margin-bottom: 22px; }

  @media (max-width: 820px) {
    #app { flex-direction: column; }
    .nav { width: 100%; flex: none; height: auto; position: sticky; top: 0; flex-direction: row; align-items: center; padding: 12px 14px; z-index: 20; border-left: none; border-bottom: 1px solid var(--border-soft); }
    .brand { flex-direction: row; align-items: baseline; gap: 8px; }
    .nav-links { flex-direction: row; overflow-x: auto; }
    .nav-link span.lbl { display: none; }
    .nav-link { padding: 10px; }
    .nav-spacer { display: none; }
    .nav-cta { padding: 10px 14px; white-space: nowrap; }
    .main { padding: 18px 16px 40px; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .row-date { display: none; }
  }

  @media print {
    body * { visibility: hidden; }
    .receipt-doc, .receipt-doc * { visibility: visible; }
    .receipt-doc { position: absolute; top: 0; right: 0; left: 0; margin: 0; border-radius: 0; }
  }
  /* ---------- Login ---------- */
  .login { max-width: 420px; margin: 12vh auto 0; padding: 0 16px; text-align: center; }
  .login .word { font-family: 'Frank Ruhl Libre', serif; font-size: 34px; font-weight: 700; color: var(--gold); }
  .login .lead { color: var(--text-muted); font-size: 14.5px; line-height: 1.7; margin: 10px 0 26px; }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #1f1f1f; border: 1px solid #dadce0; border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .gbtn:hover { background: #f8f9fa; }
  .gbtn svg { width: 20px; height: 20px; }
  .login .err { color: var(--danger); font-size: 13px; margin-top: 16px; line-height: 1.6; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@400;500;600;700;800&display=swap">

<body>
<div id="app" dir="rtl" lang="he"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
  // כתובת מסד הנתונים של Memories4U ב-Firebase. זה לא סוד, ההגנה היא בכללי האבטחה.
  window.FIREBASE_CONFIG = {
    apiKey: "AIzaSyBoVnqM5tnAUTgjxO-FywbiLGLndql62pA",
    authDomain: "memories4u-receipts.firebaseapp.com",
    projectId: "memories4u-receipts",
    storageBucket: "memories4u-receipts.firebasestorage.app",
    messagingSenderId: "610439278877",
    appId: "1:610439278877:web:63e82d5f59fb812e8a71f4"
  };
</script>

<script>
(function () {
  'use strict';
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var auth = firebase.auth();
  var fdb = firebase.firestore();
  try { fdb.enablePersistence({ synchronizeTabs: true }).catch(function () {}); } catch (e) {}

  var state = {
    db: null,
    user: null,
    authChecked: false,
    accessDenied: false,
    loginError: '',
    dbReady: false,
    settings: null,
    settingsLoaded: false,
    clients: [],
    receipts: [],
    expenses: [],
    view: 'dashboard',
    activeReceiptId: null,
    editingSettings: false,
    newReceiptDraft: null,
    newExpenseDraft: null,
    clientQuery: '',
    clientPickerOpen: false,
    listSearch: '',
    expenseSearch: '',
    saving: false,
    toast: null,
  };

  var PAY_METHODS = {
    cash: 'מזומן', card: 'אשראי', transfer: 'העברה בנקאית',
    bit: 'ביט', check: "צ'ק", other: 'אחר'
  };
  var EXPENSE_CATEGORIES = {
    equipment: 'ציוד וצילום', print: 'הדפסות ומתכלים', marketing: 'פרסום ושיווק',
    travel: 'נסיעות ואירוח', software: 'תוכנות ומנויים', rent: 'שכירות ואחסון', other: 'אחר'
  };
  var DEFAULT_EXEMPT_NOTE = 'עוסק פטור ממע"מ לפי סעיף 31 לחוק מס ערך מוסף, התשל"ו-1975. מסמך זה אינו חשבונית מס.';

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (attrs[k] == null) return;
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c == null) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }

  function fmtMoney(n) {
    n = Number(n) || 0;
    return '₪' + n.toLocaleString('he-IL', { maximumFractionDigits: 0 });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('he-IL');
  }
  function todayIso() {
    var d = new Date();
    var tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }
  function showToast(msg) {
    state.toast = msg;
    render();
    setTimeout(function () { state.toast = null; render(); }, 2400);
  }

  // ---------------- boot ----------------
  var unsubs = [];
  function stopListeners() { unsubs.forEach(function (u) { try { u(); } catch (e) {} }); unsubs = []; }
  function onListenError(e) {
    if (e && e.code === 'permission-denied') { state.accessDenied = true; }
    state.settingsLoaded = true; render();
  }

  function boot() {
    render();
    auth.getRedirectResult().catch(function (e) { state.loginError = loginErrorText(e); render(); });
    auth.onAuthStateChanged(function (user) {
      stopListeners();
      state.user = user;
      state.authChecked = true;
      state.accessDenied = false;
      state.settings = null; state.settingsLoaded = false;
      state._settingsDraft = null;
      state.clients = []; state.receipts = []; state.expenses = [];
      state.db = user ? fdb : null;
      state.dbReady = true;
      render();
      if (!user) return;
      var db = fdb;
      unsubs.push(db.doc('settings/business').onSnapshot(function (snap) {
        state.settings = snap.exists ? snap.data() : null;
        state.settingsLoaded = true;
        render();
      }, onListenError));
      unsubs.push(db.collection('clients').orderBy('name').onSnapshot(function (qs) {
        state.clients = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        render();
      }, onListenError));
      unsubs.push(db.collection('receipts').orderBy('number', 'desc').limit(1000).onSnapshot(function (qs) {
        state.receipts = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        render();
      }, onListenError));
      unsubs.push(db.collection('expenses').orderBy('date', 'desc').limit(1000).onSnapshot(function (qs) {
        state.expenses = qs.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
        render();
      }, onListenError));
    });
  }

  function loginErrorText(e) {
    var c = (e && e.code) || '';
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
    if (c === 'auth/unauthorized-domain') return 'הכתובת של האתר עוד לא אושרה ב-Firebase. צריך להוסיף אותה ב-Authentication, בלשונית Settings, תחת Authorized domains.';
    if (c === 'auth/network-request-failed') return 'אין חיבור לאינטרנט. בדקו את החיבור ונסו שוב.';
    return 'הכניסה לא הצליחה, נסו שוב' + (c ? ' (' + c + ')' : '');
  }

  function signIn() {
    state.loginError = ''; render();
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    auth.signInWithPopup(provider).catch(function (e) {
      if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) {
        return auth.signInWithRedirect(provider);
      }
      state.loginError = loginErrorText(e); render();
    });
  }
  function signOut() {
    if (!confirm('להתנתק מהמערכת במכשיר הזה?')) return;
    auth.signOut();
  }

  // שמירת קובץ למחשב או לטלפון
  function saveFile(filename, data, mime) {
    try {
      var blob = new Blob([data], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      return Promise.resolve();
    } catch (e) { return Promise.reject(e); }
  }

  // ---------------- nav ----------------
  function renderNav(root) {
    var links = [
      { id: 'dashboard', label: 'לוח בקרה', ic: '◆' },
      { id: 'receipts', label: 'קבלות', ic: '▤' },
      { id: 'expenses', label: 'הוצאות', ic: '⊟' },
      { id: 'clients', label: 'לקוחות', ic: '◈' },
      { id: 'settings', label: 'הגדרות', ic: '⚙' },
    ];
    var isExpenseCtx = state.view === 'expenses' || state.view === 'newExpense';
    var nav = el('div', { class: 'nav' }, [
      el('div', { class: 'brand' }, [
        el('div', { class: 'word' }, ['Memories4U']),
        el('div', { class: 'sub' }, ['ניהול כספי']),
      ]),

  // ---------------- dashboard ----------------
  function monthKey(d) { return (d || '').slice(0, 7); }
  function renderDashboard(main) {
    var thisMonth = monthKey(todayIso());
    var incomeTotal = 0, pendingTotal = 0, expenseTotal = 0;
    state.receipts.forEach(function (r) {
      if (r.status === 'paid') {
        if (monthKey(r.issueDate) === thisMonth) incomeTotal += Number(r.amount) || 0;
      } else {
        pendingTotal += Number(r.amount) || 0;
      }
    });
    state.expenses.forEach(function (x) {
      if (monthKey(x.date) === thisMonth) expenseTotal += Number(x.amount) || 0;
    });
    var profit = incomeTotal - expenseTotal;

    main.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', {}, ['לוח בקרה']),
        el('div', { class: 'hint' }, [businessGreeting()]),
      ]),
    ]));

    var lastBackup = state.settings && state.settings.lastBackupAt;
    var daysSince = lastBackup ? Math.floor((Date.now() - lastBackup) / 86400000) : null;
    if ((state.receipts.length || state.expenses.length) && (!lastBackup || daysSince > 30)) {
      main.appendChild(el('div', {
        class: 'card', style: 'display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;border-color:rgba(217,198,150,.4);flex-wrap:wrap'
      }, [
        el('div', { style: 'font-size:13.5px;color:var(--text-muted)' }, [
          lastBackup ? ('לא הורדת גיבוי כבר ' + daysSince + ' יום - שווה להוריד עותק עדכני') : 'עדיין לא הורדת גיבוי לנתונים שלך - מומלץ להוריד עותק'
        ]),
        el('button', { class: 'btn small', onclick: function () { state.view = 'settings'; render(); } }, ['למעבר להגדרות וגיבוי']),
      ]));
    }

    main.appendChild(el('div', { class: 'kpis' }, [
      el('div', { class: 'card kpi' }, [
        el('div', { class: 'label' }, ['הכנסות החודש']),
        el('div', { class: 'value' }, [fmtMoney(incomeTotal)]),
      ]),
      el('div', { class: 'card kpi', style: 'border-color:rgba(179,84,63,.3)' }, [
        el('div', { class: 'label' }, ['הוצאות החודש']),
        el('div', { class: 'value', style: 'color:#c98a6f' }, [fmtMoney(expenseTotal)]),

        el('div', { class: 'label' }, ['ממתין לתשלום']),
        el('div', { class: 'value' }, [fmtMoney(pendingTotal)]),
      ]),
    ]));

    main.appendChild(el('div', { class: 'section-title' }, ['קבלות אחרונות']));

  function exportCsv() {
    var rows = [['מספר', 'תאריך', 'לקוח', 'תיאור', 'סכום', 'אופן תשלום', 'סטטוס']];
    state.receipts.slice().sort(function (a, b) { return a.number - b.number; }).forEach(function (r) {
      rows.push([r.number, fmtDate(r.issueDate), r.clientName || '', (r.description || '').replace(/\n/g, ' '),
        r.amount, PAY_METHODS[r.method] || r.method, r.status === 'paid' ? 'שולם' : 'ממתין']);
    });
    var csv = '﻿' + rows.map(function (row) {
      return row.map(function (c) { return '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"'; }).join(',');
    }).join('\r\n');
    saveFile('קבלות-Memories4U.csv', csv, 'text/csv;charset=utf-8')
      .then(function () { showToast('הקובץ נשמר'); })
      .catch(function () { showToast('לא ניתן לשמור כרגע'); });
  }

  function exportExpensesCsv() {
    var rows = [['תאריך', 'קטגוריה', 'תיאור', 'ספק', 'סכום', 'אופן תשלום']];

    saveFile('הוצאות-Memories4U.csv', csv, 'text/csv;charset=utf-8')
      .then(function () { showToast('הקובץ נשמר'); })
      .catch(function () { showToast('לא ניתן לשמור כרגע'); });

  async function saveNewExpense() {
    var d = state.newExpenseDraft;
    if (state.saving) return;
    if (!(Number(d.amount) > 0)) { showToast('צריך למלא סכום גדול מ-0'); return; }
    if (!state.db) { showToast('צריך להתחבר כדי לשמור'); return; }
    state.saving = true; render();
    try {
      await state.db.collection('expenses').add({
        date: d.date, category: d.category, description: d.description || '',
        vendor: d.vendor || '', amount: Number(d.amount), method: d.method, notes: d.notes || '',
        createdAt: Date.now()
      });
      state.saving = false;
      state.view = 'expenses';
      render();
      showToast('ההוצאה נרשמה');
    } catch (e) {
      state.saving = false; render();
      showToast('שגיאה ברישום ההוצאה, נסו שוב');
    }
  }

  async function deleteExpense(x) {
    if (!confirm('למחוק את ההוצאה "' + (x.description || EXPENSE_CATEGORIES[x.category]) + '"?')) return;
    if (!state.db) return;
    try { await state.db.doc('expenses/' + x.id).delete(); showToast('ההוצאה נמחקה'); }
    catch (e) { showToast('שגיאה במחיקה'); }
  }

  // ---------------- clients ----------------
  function clientStats(clientId) {
    var total = 0, count = 0;
    state.receipts.forEach(function (r) {
      if (r.clientId === clientId) { count++; if (r.status === 'paid') total += Number(r.amount) || 0; }
    });
    return { total: total, count: count };
  }

  async function saveNewReceipt() {
    var d = state.newReceiptDraft;
    if (state.saving) return;
    if (!d.clientName.trim()) { showToast('צריך למלא שם לקוח'); return; }
    if (!(Number(d.amount) > 0)) { showToast('צריך למלא סכום גדול מ-0'); return; }
    if (!state.db) { showToast('צריך להתחבר כדי לשמור'); return; }
    state.saving = true; render();
    try {
      var clientId = d.clientId;
      if (!clientId) {
        var existing = state.clients.find(function (c) { return c.name === d.clientName.trim(); });
        if (existing) clientId = existing.id;
        else {
          var ref = await state.db.collection('clients').add({
            name: d.clientName.trim(), phone: d.clientPhone || '', email: '', createdAt: Date.now()
          });
          clientId = ref.id;
        }
      }
      var receiptRef = state.db.collection('receipts').doc();
      var number = await state.db.runTransaction(function (tx) {
        var sref = state.db.doc('settings/business');
        return tx.get(sref).then(function (snap) {
          var sd = snap.exists ? snap.data() : {};
          var n = Number(sd.nextNumber) || Number(sd.startNumber) || 1;
          tx.set(sref, { nextNumber: n + 1 }, { merge: true });
          tx.set(receiptRef, {
            number: n, clientId: clientId, clientName: d.clientName.trim(),
            clientPhone: d.clientPhone || '', description: d.description || '',
            amount: Number(d.amount), method: d.method, status: d.status,
            eventDate: d.eventDate, issueDate: d.issueDate, notes: d.notes || '',
            createdAt: Date.now(), createdBy: (state.user && state.user.email) || ''
          });
          return n;
        });
      });
      state.saving = false;
      state.view = 'receipts';
      state.activeReceiptId = receiptRef.id;
      render();
      showToast('הקבלה מס\' ' + number + ' נוצרה');
    } catch (e) {
      state.saving = false; render();
      showToast('שגיאה ביצירת הקבלה, נסו שוב');

  // ---------------- PDF ----------------
  var LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ];
  var libsPromise = null;
  function loadPdfLibs() {
    if (libsPromise) return libsPromise;
    libsPromise = LIBS.reduce(function (p, src) {
      return p.then(function () {
        return new Promise(function (res, rej) {
          var sc = document.createElement('script');
          sc.src = src; sc.onload = res; sc.onerror = rej;
          document.head.appendChild(sc);
        });
      });
    }, Promise.resolve()).catch(function (e) { libsPromise = null; throw e; });
    return libsPromise;
  }

  var pdfCache = {};
  function pdfKey(r, s) {
    return [r.id, r.number, r.status, r.amount, r.method, r.clientName, r.description, r.issueDate, r.eventDate,
      s.businessName, s.idNumber, s.address, s.phone, s.email, s.exemptNote].join('|');
  }
  function pdfFileName(r) { return 'קבלה-' + r.number + '-Memories4U.pdf'; }

  // מכין את ה-PDF מראש כשהקבלה נפתחת, כדי שכפתור השליחה יעבוד מיד גם באייפד ובטלפון
  function getReceiptPdf(r, s) {
    var key = pdfKey(r, s);
    var entry = pdfCache[key];
    if (entry) return entry;
    entry = pdfCache[key] = { blob: null, error: null };
    makeReceiptPdf(r, s).then(function (blob) {
      entry.blob = blob; render();
    }).catch(function () {
      entry.error = true; delete pdfCache[key]; render();
    });
    return entry;
  }

  async function makeReceiptPdf(r, s) {
    await loadPdfLibs();
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch (e) {} }
    var holder = el('div', { dir: 'rtl', style: 'position:fixed;left:-10000px;top:0;width:760px;background:#fff;padding:36px;font-family:Heebo,sans-serif' }, [buildReceiptDoc(r, s)]);
    document.body.appendChild(holder);
    try {
      var canvas = await window.html2canvas(holder, { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false });
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
      var pageW = 210, margin = 10;
      var w = pageW - margin * 2;
      var h = canvas.height * w / canvas.width;
      doc.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', margin, margin, w, h);
      doc.setProperties({ title: 'קבלה ' + r.number + ' ' + ((s.businessName) || 'Memories4U') });
      return doc.output('blob');
    } finally {
      holder.remove();
    }
  }

  function shareReceiptPdf(r, s) {
    var entry = pdfCache[pdfKey(r, s)];
    if (!entry || !entry.blob) return;
    var name = pdfFileName(r);
    var file = null;
    try { file = new File([entry.blob], name, { type: 'application/pdf' }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'קבלה מס\' ' + r.number })
        .catch(function (e) { if (!e || e.name !== 'AbortError') saveFile(name, entry.blob); });
      return;
    }
    saveFile(name, entry.blob).then(function () { showToast('ה-PDF ירד למחשב, אפשר לצרף אותו לוואטסאפ או למייל'); });
  }

        'החשבון ' + ((state.user && state.user.email) || '') + ' לא מורשה לגשת לנתונים של Memories4U. אם זו טעות, התנתקו והיכנסו עם חשבון הגוגל של העסק.'
      ]),
      el('button', { class: 'btn', onclick: function () { auth.signOut(); } }, ['התנתקות וכניסה עם חשבון אחר']),
    ]));
  }

  // ---------------- render root ----------------
  function render() {
    var root = document.getElementById('app');
    root.innerHTML = '';
    closeOverlay();
    var old = document.getElementById('receipt-overlay'); if (old) old.remove();

    if (!state.authChecked) { return; }
    if (!state.user) { renderLogin(root); return; }
    if (state.accessDenied) { renderDenied(root); return; }
    renderNav(root);
    var main = el('div', { class: 'main' }, []);
    root.appendChild(main);

    if (!state.settingsLoaded) { return; }
    if (!state.settings) { renderGate(main); return; }

    if (state.view === 'dashboard') renderDashboard(main);
    else if (state.view === 'receipts') renderReceiptsPage(main);
    else if (state.view === 'expenses') renderExpensesPage(main);
    else if (state.view === 'clients') renderClientsPage(main);
    else if (state.view === 'settings') renderSettingsPage(main);
    else if (state.view === 'newReceipt') renderNewReceipt(main);
    else if (state.view === 'newExpense') renderNewExpense(main);

    if (state.activeReceiptId) renderReceiptDetail();

    if (state.toast) {
      root.appendChild(el('div', {
        style: 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);font-size:13.5px;z-index:60'
      }, [state.toast]));
    }
  }

  boot();
})();
</script>

</body></html>
